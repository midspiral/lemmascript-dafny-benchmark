name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Everything that needs neither Dafny nor the case-study checkouts, so it runs
  # in seconds on every push. Regenerating the benchmark is the real check, but
  # it needs eighteen clones and ten minutes of solver time — see `full` below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Artifacts are internally consistent
        run: npm run check-artifacts

      - name: Task listing renders
        run: npm run list-tasks

  # The fixture suite runs `dafny verify`, so it needs the toolchain — pinned to
  # the same version the benchmark records. A Dafny bump that reworded a warning
  # fails here rather than silently widening what the benchmark accepts.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: '4.11.0'

      - name: Fixture suite
        run: npm test

      # The attempt directory is the first thing a user touches, and it carries
      # *copies* of the validator's sources. Adding a module to that import
      # graph without adding it to the copy list breaks every attempt directory
      # and nothing else would notice, so build one and run its checker.
      - name: Attempt directory works standalone
        run: |
          npm run make-attempt -- 5 --out="$RUNNER_TEMP/attempt"
          cd "$RUNNER_TEMP/attempt"
          out=$(npx tsx .bench/check.ts || true)
          echo "$out"
          echo "$out" | grep -q "additions-only  passed" \
            || { echo "::error::the attempt checker did not run"; exit 1; }
          echo "$out" | grep -q "^FAIL" \
            || { echo "::error::the untouched task should not pass"; exit 1; }

      # The same contract a runner codes against.
      - name: check CLI scores a candidate
        run: |
          out=$(npm run --silent check -- 5 tasks/0005.dfy || true)
          echo "$out"
          echo "$out" | grep -q "verifies        failed" \
            || { echo "::error::check did not evaluate the task"; exit 1; }
